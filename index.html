<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tender Engine - North East LMO AI</title>
    <style>
        :root {
            --emerald: #059669;
            --emerald-light: #34d399;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --border-subtle: #334155;
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-gold: #fbbf24;
            --danger-red: #f87171;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        .header {
            text-align: center;
            padding: 28px 20px;
            border-bottom: 3px solid var(--emerald);
            background-color: var(--card-bg);
            border-radius: 10px;
            margin-bottom: 25px;
        }
        .header h1 {
            color: var(--emerald-light);
            margin: 0 0 8px 0;
            font-size: 2.3rem;
            letter-spacing: 1px;
        }
        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1.05rem;
        }
        .main-container {
            display: grid;
            grid-template-columns: 2.2fr 1fr;
            gap: 25px;
            max-width: 1280px;
            margin: 0 auto;
        }
        @media (max-width: 850px) {
            .main-container { grid-template-columns: 1fr; }
        }
        .section-title {
            font-size: 1.4rem;
            color: var(--emerald-light);
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 10px;
            margin: 0 0 18px 0;
        }
        .filter-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .filter-select {
            background-color: var(--card-bg);
            color: var(--text-light);
            border: 1px solid var(--border-subtle);
            padding: 11px 14px;
            border-radius: 8px;
            flex: 1;
            min-width: 180px;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .filter-select:focus {
            outline: none;
            border-color: var(--emerald-light);
        }
        .tender-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-left: 5px solid var(--emerald);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 18px;
        }
        .tender-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.88rem;
            flex-wrap: wrap;
            gap: 8px;
        }
        .district-badge {
            background-color: #0f172a;
            border: 1px solid var(--border-subtle);
            padding: 4px 10px;
            border-radius: 5px;
            color: var(--text-light);
            font-weight: 600;
        }
        .win-probability {
            background-color: rgba(5, 150, 105, 0.2);
            color: var(--emerald-light);
            padding: 4px 10px;
            border-radius: 5px;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .tender-title {
            margin: 0 0 8px 0;
            font-size: 1.15rem;
            color: #ffffff;
        }
        .tender-dept {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .tender-value {
            font-size: 1.25rem;
            color: var(--accent-gold);
            font-weight: bold;
            margin: 12px 0;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border-subtle);
            font-size: 0.88rem;
            color: var(--text-muted);
        }
        .btn-bid {
            background-color: var(--emerald);
            color: #ffffff;
            text-decoration: none;
            padding: 9px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            display: inline-block;
        }
        .btn-bid:hover {
            background-color: var(--emerald-light);
            color: #0f172a;
        }
        .sidebar-card {
            background-color: var(--card-bg);
            border: 1px dashed var(--accent-gold);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .btn-loan {
            display: block;
            text-align: center;
            background-color: var(--accent-gold);
            color: #0f172a;
            padding: 12px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 15px;
        }
        .adsense-placeholder {
            background-color: #0f172a;
            text-align: center;
            padding: 18px;
            font-size: 11px;
            color: var(--text-muted);
            border: 1px dashed var(--border-subtle);
            margin-top: 16px;
            border-radius: 6px;
        }
        .disclaimer-card {
            background-color: rgba(248, 113, 113, 0.08);
            border: 1px solid rgba(248, 113, 113, 0.35);
            padding: 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #fecaca;
            line-height: 1.5;
        }
        .disclaimer-title {
            color: var(--danger-red);
            font-weight: bold;
            margin-bottom: 6px;
        }
    </style>
</head>
