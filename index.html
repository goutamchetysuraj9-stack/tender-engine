<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TENDER ENGINE | North East & India Public Procurement Dashboard</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #16a34a;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.5; }
        
        /* Header */
        header {
            background: var(--primary);
            color: white;
            padding: 1.25rem 1.5rem;
            border-bottom: 4px solid var(--accent);
        }
        .header-inner { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; }
        .brand h1 { font-size: 1.5rem; letter-spacing: 0.5px; display: flex; align-items: center; gap: 0.5rem; }
        .brand p { font-size: 0.85rem; color: #94a3b8; }
        .live-badge { background: #dc2626; color: white; font-size: 0.75rem; font-weight: bold; padding: 0.25rem 0.6rem; border-radius: 999px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        /* Main Container */
        .container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }

        /* AdSense Slot */
        .ad-slot {
            background: #e2e8f0;
            border: 1px dashed #94a3b8;
            color: #475569;
            text-align: center;
            padding: 1rem;
            margin: 1.25rem 0;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Filter Control Panel */
        .filter-panel {
            background: var(--card-bg);
            padding: 1.25rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .filter-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--muted); margin-bottom: 0.35rem; text-transform: uppercase; }
        .filter-group select, .filter-group input {
            width: 100%;
            padding: 0.65rem 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            background: white;
        }
        .filter-group select:focus, .filter-group input:focus { outline: none; border-color: var(--accent); }

        /* Quick Department Pills */
        .dept-pills { display: flex; flex-wrap: wrap; gap: 0.5rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
        .pill {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 0.35rem 0.8rem;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pill:hover, .pill.active { background: var(--accent); color: white; border-color: var(--accent); }

        /* Dynamic Official Portal Action Banner */
        .portal-action-box {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border: 1px solid #93c5fd;
            border-radius: 12px;
            padding: 1.15rem 1.25rem;
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .portal-info h3 { font-size: 1.05rem; color: #1e3a8a; margin-bottom: 0.2rem; }
        .portal-info p { font-size: 0.85rem; color: #1e40af; }
        .portal-btn {
            background: var(--accent);
            color: white;
            text-decoration: none;
            padding: 0.7rem 1.25rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .portal-btn:hover { background: var(--accent-hover); }

        /* Stats Bar */
        .stats-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: var(--muted); font-weight: 600; }

        /* Tender Cards Grid */
        .tender-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.25rem;
        }
        .tender-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.15s;
        }
        .tender-card:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.08); }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.75rem; }
        .loc-tag { background: #f1f5f9; color: #334155; font-size: 0.78rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 6px; }
        .win-tag { background: #dcfce7; color: #166534; font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 6px; }
        .tender-title { font-size: 1.05rem; font-weight: 700; color: var(--primary); margin-bottom: 0.6rem; }
        .tender-budget { font-size: 1.15rem; font-weight: 800; color: var(--success); margin-bottom: 0.6rem; }
        .tender-meta { font-size: 0.83rem; color: var(--muted); margin-bottom: 1rem; border-top: 1px solid var(--border); padding-top: 0.6rem; }
        .tender-meta div { margin-bottom: 0.25rem; }
        .bid-btn {
            display: block;
            text-align: center;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 0.65rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .bid-btn:hover { background: var(--accent); }

        /* Empty / Fallback State */
        .empty-box {
            grid-column: 1 / -1;
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
        }
        .empty-box h3 { margin-bottom: 0.5rem; color: var(--primary); }
        .empty-box p { color: var(--muted); font-size: 0.92rem; margin-bottom: 1rem; }

        /* Footer */
        footer {
            background: var(--primary);
            color: #94a3b8;
            padding: 1.5rem;
            margin-top: 2.5rem;
            font-size: 0.82rem;
            text-align: center;
        }
        footer p { max-width: 900px; margin: 0 auto; }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="brand">
            <h1>⚡ TENDER ENGINE <span class="live-badge">LIVE PORTAL</span></h1>
            <p>North East & All-India Automated Public Procurement Intelligence</p>
        </div>
    </div>
</header>

<div class="container">
    <div class="ad-slot">[ GOOGLE ADSENSE RESPONSIVE TOP BANNER SLOT ]</div>

    <div class="filter-panel">
        <div class="filter-grid">
            <div class="filter-group">
                <label for="stateFilter">Select State</label>
                <select id="stateFilter">
                    <option value="ALL">All North East States</option>
                    <option value="Assam" selected>Assam</option>
                    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                    <option value="Manipur">Manipur</option>
                    <option value="Meghalaya">Meghalaya</option>
                    <option value="Mizoram">Mizoram</option>
                    <option value="Nagaland">Nagaland</option>
                    <option value="Sikkim">Sikkim</option>
                    <option value="Tripura">Tripura</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="districtFilter">Select District / Region</label>
                <select id="districtFilter">
                    <option value="ALL">All Districts</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="deptFilter">Select Department</label>
                <select id="deptFilter">
                    <option value="ALL">All Departments</option>
                    <option value="PWD">PWD (Roads & Building)</option>
                    <option value="Irrigation">Irrigation Department</option>
                    <option value="PHE">PHE (Water Supply)</option>
                    <option value="Health">Health & Family Welfare</option>
                    <option value="Education">Education / Samagra Shiksha</option>
                    <option value="Power">Power / APDCL / Energy</option>
                    <option value="BTR">BTR / Municipal / Panchayat</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="searchInput">Keyword Search</label>
