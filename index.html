<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TENDER ENGINE | Automated Public Procurement & Contractor Logistics Dashboard</title>
    <style>
        :root {
            --bg-dark: #06110e;
            --card-bg: #0c1f1a;
            --card-border: #1b4338;
            --emerald: #10b981;
            --emerald-dark: #059669;
            --gold: #f59e0b;
            --gold-light: #fbbf24;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --ad-bg: #0a1814;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.5; padding-bottom: 50px; }
        
        /* Header */
        header {
            background: linear-gradient(135deg, #091c16 0%, #040d0a 100%);
            border-bottom: 2px solid var(--gold);
            padding: 22px 5%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        .brand h1 { font-size: 1.65rem; color: var(--gold-light); letter-spacing: 1px; font-weight: 800; }
        .brand p { font-size: 0.88rem; color: var(--emerald); font-weight: 500; }
        .live-badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--emerald);
            color: var(--emerald);
            padding: 7px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
        }

        .container { max-width: 1200px; margin: 25px auto; padding: 0 5%; }

        /* Budget Overview Strip */
        .budget-strip {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 22px;
        }
        .budget-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-left: 4px solid var(--gold);
            padding: 15px 18px;
            border-radius: 10px;
        }
        .budget-card span { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .budget-card h2 { font-size: 1.35rem; color: var(--gold-light); margin-top: 4px; }

        /* Filter Bar */
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px;
            background: var(--card-bg);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            margin-bottom: 25px;
        }
        select {
            width: 100%;
            padding: 11px 14px;
            background: var(--bg-dark);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 0.92rem;
            cursor: pointer;
            outline: none;
        }
        select:focus { border-color: var(--gold); }
        .btn-reset {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold-light);
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-reset:hover { background: var(--gold); color: #000; }

        /* Tender Cards */
        .tender-grid { display: flex; flex-direction: column; gap: 18px; }
        .tender-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 22px;
            transition: transform 0.2s, border-color 0.2s;
        }
        .tender-card:hover { border-color: var(--gold); transform: translateY(-2px); }
        .card-top {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .location { color: var(--gold-light); font-weight: 600; font-size: 0.9rem; }
        .badge { padding: 4px 12px; border-radius: 6px; font-weight: 700; font-size: 0.78rem; }
        .badge-high { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #059669; }
        .badge-med { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #d97706; }
        
        .tender-title { font-size: 1.18rem; font-weight: 700; margin-bottom: 8px; color: #ffffff; }
        .tender-value { font-size: 1.3rem; font-weight: 800; color: var(--emerald); margin-bottom: 8px; }
        .tender-meta { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 16px; }
        
        .card-bottom {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-top: 14px;
            border-top: 1px solid var(--card-border);
        }
        .closing { font-size: 0.88rem; color: #fca5a5; font-weight: 600; }
        .btn-bid {
            background: linear-gradient(135deg, var(--emerald) 0%, var(--emerald-dark) 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-block;
            transition: opacity 0.2s;
        }
        .btn-bid:hover { opacity: 0.9; }

        /* AdSense Slots */
        .ad-slot {
            background: var(--ad-bg);
            border: 1px dashed #28594b;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            color: #6ee7b7;
            font-size: 0.82rem;
            letter-spacing: 1px;
        }

        /* Contractor Capital Section */
        .capital-box {
            margin-top: 35px;
            background: linear-gradient(135deg, #0f2c23 0%, #071410 100%);
            border: 1.5px solid var(--gold);
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }
        .capital-info h3 { color: var(--gold-light); margin-bottom: 6px; font-size: 1.25rem; }
        .capital-info p { color: var(--text-muted); font-size: 0.92rem; max-width: 650px; }
        .btn-loan {
            background: linear-gradient(135deg, var(--gold) 0%, #d97706 100%);
            color: #000000;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.92rem;
            display: inline-block;
        }

        /* Legal Disclaimer */
        .disclaimer {
            margin-top: 30px;
            padding: 18px;
            background: rgba(245, 158, 11, 0.06);
            border-left: 4px solid var(--gold);
            border-radius: 6px;
            font-size: 0.84rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <h1>⚡ TENDER ENGINE</h1>
        <p>Automated Public Procurement & Contractor Logistics Dashboard</p>
    </div>
    <div class="live-badge">● Live Local Tenders</div>
</header>

<div class="container">
    <!-- Budget Summary Cards -->
    <div class="budget-strip">
        <div class="budget-card">
            <span>Active Portal Value</span>
            <h2 id="totalValue">₹22.47 Crore</h2>
        </div>
        <div class="budget-card">
            <span>High Win-Rate Contracts</span>
            <h2 id="highWinCount">8 Tenders</h2>
        </div>
        <div class="budget-card">
            <span>Coverage Region</span>
            <h2>Assam & North East</h2>
        </div>
    </div>

    <!-- Dropdown Filters (No Typing Needed) -->
    <div class="filters">
        <select id="stateFilter" onchange="updateDistricts(); filterTenders();">
            <option value="ALL">All States (North East / India)</option>
            <option value="Assam">Assam</option>
            <option value="Meghalaya">Meghalaya</option>
            <option value="Arunachal Pradesh">Arunachal Pradesh</option>
            <option value="Tripura">Tripura</option>
            <option value="Nagaland">Nagaland</option>
            <option value="Manipur">Manipur</option>
            <option value="Mizoram">Mizoram</option>
            <option value="Sikkim">Sikkim</option>
        </select>

        <select id="districtFilter" onchange="filterTenders()">
            <option value="ALL">All Districts</option>
            <option value="Udalguri">Udalguri (Assam)</option>
            <option value="Nalbari">Nalbari (Assam)</option>
            <option value="Kamrup Metro">Guwahati / Kamrup Metro (Assam)</option>
            <option value="Barpeta">Barpeta (Assam)</option>
            <option value="Sonitpur">Tezpur / Sonitpur (Assam)</option>
            <option value="Dibrugarh">Dibrugarh (Assam)</option>
            <option value="Cachar">Silchar / Cachar (Assam)</option>
            <option value="East Khasi Hills">Shillong / East Khasi Hills (Meghalaya)</option>
            <option value="Papum Pare">Itanagar (Arunachal Pradesh)</option>
            <option value="West Tripura">Agartala (Tripura)</option>
            <option value="Kohima">Kohima (Nagaland)</option>
            <option value="Imphal West">Imphal (Manipur)</option>
            <option value="Aizawl">Aizawl (Mizoram)</option>
            <option value="Gangtok">Gangtok (Sikkim)</option>
        </select>
