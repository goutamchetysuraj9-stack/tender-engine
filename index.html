<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TENDER ENGINE | Automated Public Procurement & Contractor Logistics Dashboard</title>
    <style>
        :root {
            --bg-main: #0f171a;       /* Soft, eye-friendly deep slate */
            --bg-panel: #162226;      /* Calm card background */
            --bg-hover: #1d2d32;      /* Gentle hover highlight */
            --border: #263a40;        /* Subtle muted border */
            --accent: #38a889;        /* Soft muted emerald (no eye strain) */
            --accent-hover: #2d8a70;
            --text-primary: #e2e8f0;  /* Soft off-white text */
            --text-secondary: #94a3b8;/* Muted grey-blue text */
            --badge-high-bg: rgba(56, 168, 137, 0.14);
            --badge-high-txt: #6ee7b7;
            --badge-med-bg: rgba(217, 160, 91, 0.14);
            --badge-med-txt: #fcd34d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); line-height: 1.5; }

        /* Top Header */
        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 16px 4%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .brand h1 { font-size: 1.35rem; color: var(--text-primary); font-weight: 700; letter-spacing: 0.4px; }
        .brand span { color: var(--accent); }
        .brand p { font-size: 0.82rem; color: var(--text-secondary); }
        .live-pill {
            background: var(--badge-high-bg);
            color: var(--badge-high-txt);
            border: 1px solid rgba(56, 168, 137, 0.3);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        /* Filter Bar */
        .filter-bar {
            max-width: 1320px;
            margin: 18px auto 0;
            padding: 0 4%;
        }
        .filter-box {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }
        select {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 7px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }
        select:focus { border-color: var(--accent); }

        /* Main 2-Column Layout (Left Continuous Tender List + Right Info/Ad Sidebar) */
        .main-layout {
            max-width: 1320px;
            margin: 18px auto 40px;
            padding: 0 4%;
            display: grid;
            grid-template-columns: 2.1fr 1fr;
            gap: 22px;
            align-items: start;
        }
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        /* Left Column: Continuous Tender List */
        .tender-column {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
            color: var(--text-secondary);
            padding-bottom: 4px;
        }
        .tender-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            transition: background 0.2s, border-color 0.2s;
        }
        .tender-card:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
        }
        .card-top {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 0.84rem;
        }
        .loc-tag { color: var(--text-secondary); font-weight: 500; }
        .badge { padding: 3px 10px; border-radius: 5px; font-size: 0.76rem; font-weight: 600; }
        .badge-high { background: var(--badge-high-bg); color: var(--badge-high-txt); }
        .badge-med { background: var(--badge-med-bg); color: var(--badge-med-txt); }
        
        .t-title { font-size: 1.08rem; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
        .t-amount { font-size: 1.18rem; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
        .t-meta { font-size: 0.83rem; color: var(--text-secondary); margin-bottom: 14px; }
        
        .card-footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .closing-date { font-size: 0.83rem; color: #e2a0a0; font-weight: 500; }
        .btn-portal {
            background: var(--accent);
            color: #0b1416;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            transition: background 0.2s;
        }
        .btn-portal:hover { background: var(--accent-hover); color: #fff; }

        /* Right Column: Sticky Sidebar (Contractor Capital + Ads + Legal) */
        .sidebar-column {
            display: flex;
            flex-direction: column;
            gap: 18px;
            position: sticky;
            top: 20px;
        }
        .side-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }
        .side-card h3 { font-size: 1.08rem; color: var(--text-primary); margin-bottom: 8px; }
        .side-card p { font-size: 0.86rem; color: var(--text-secondary); margin-bottom: 16px; }
        .btn-loan {
            display: block;
            text-align: center;
            background: transparent;
            border: 1.5px solid var(--accent);
            color: var(--accent);
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 7px;
            font-weight: 700;
            font-size: 0.88rem;
            transition: all 0.2s;
        }
        .btn-loan:hover { background: var(--accent); color: #0b1416; }

        .ad-slot {
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 18px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.78rem;
            letter-spacing: 0.8px;
        }
        .disclaimer-box {
            background: var(--bg-panel);
            border-left: 3px solid var(--text-secondary);
            border-radius: 6px;
            padding: 14px;
            font-size: 0.78rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <h1><span>TENDER</span> ENGINE</h1>
        <p>Automated Public Procurement & Contractor Logistics Dashboard</p>
    </div>
    <div class="live-pill">⚡ Live Local Tenders</div>
</header>

<div class="filter-bar">

            <option value="Assam">Assam</option>

            <option value="Arunachal Pradesh">Arunachal Pradesh</option>
            <option value="Tripura">Tripura</option>
            <option value="Nagaland">Nagaland</option>
            <option value="Manipur">Manipur</option>
            <option value="Mizoram">Mizoram</option>
            <option value="Sikkim">Sikkim</option>
        </select>

        <select id="districtFilter" onchange="onDistrictChange()">
            <option value="ALL">All Districts</option>
            <option value="Udalguri">Udalguri (Assam)</option>
            <option value="Nalbari">Nalbari (Assam)</option>
            <option value="Kamrup Metro">Guwahati / Kamrup Metro (Assam)</option>
            <option value="Barpeta">Barpeta (Assam)</option>
            <option value="Sonitpur">Tezpur / Sonitpur (Assam)</option>
            <option value="Dibrugarh">Dibrugarh (Assam)</option>
            <option value="Cachar">Silchar / Cachar (Assam)</option>
            <option value="East Khasi Hills">Shillong (Meghalaya)</option>
            <option value="Papum Pare">Itanagar (Arunachal Pradesh)</option>
            <option value="West Tripura">Agartala (Tripura)</option>
            <option value="Kohima">Kohima (Nagaland)</option>
            <option value="Imphal West">Imphal (Manipur)</option>
            <option value="Aizawl">Aizawl (Mizoram)</option>
            <option value="Gangtok">Gangtok (Sikkim)</option>
        </select>

        <select id="deptFilter" onchange="filterTenders()">
            <option value="ALL">All Departments</option>
            <option value="PWD">PWD / Construction</option>
            <option value="IT">IT & Office Supply</option>
            <option value="Water">PHE / Water Supply</option>
            <option value="Power">Power & Solar</option>
            <option value="Education">Education</option>
