name: Automated Tender Scraper Engine

on:
  schedule:
    - cron: '0 */6 * * *'  # Har 6 ghante mein automatic chalega
  workflow_dispatch:       # Manual "Run workflow" button ke liye

permissions:
  contents: write          # tenders.json ko auto-save karne ke liye zaroori

jobs:
  build-and-scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 urllib3

      - name: Run North East Tender Scraper
        run: python scraper.py

      - name: Commit and push updated tenders.json
        run: |
          git config --global user.name "Tender-Engine-Bot"
          git config --global user.email "bot@://github.com"
          git add tenders.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update North East tenders" && git push)
