name: Auto Scrape North East Tenders

on:
  schedule:
    - cron: '0 3 * * *' # रोज़ सुबह 8:30 AM IST पर चलेगा
  workflow_dispatch:       # आप जब चाहें Run workflow बटन दबाकर चला सकते हैं

permissions:
  contents: write

jobs:
  build-and-scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Scraper
        run: python scraper.py

      - name: Commit & Push Updated Tenders
        run: |
          git config --local user.email "bot@tender-engine.local"
          git config --local user.name "Tender Engine Bot"
          git add tenders.json
          git commit -m "Auto-update live tenders" || exit 0
          git push
