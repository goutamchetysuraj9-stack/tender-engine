name: Automated Tender Scraper Engine

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 🎯 Yahan 'scraper.py' ki jagah sahi naam 'script.py' set kar diya hai
    - name: Run Automated Scraper
      run: python script.py

    - name: Commit and Push Updated Data
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "goutamchetysuraj9-stack"
        git config --global user.email "goutamchetysuraj9@gmail.com"
        git add tenders.json
        git diff-index --quiet HEAD || (git commit -m "Automated Sync: Update active tender database structures" && git push)
